    // =========================================================
    // STATE
    // =========================================================
    let myUserId = `user-${Date.now()}-${Math.floor(Math.random() * 99999)}`;
    let userData = { name: "", room: "SUCCESS", gender: "Male", language: "nl", voiceId: null, voiceName: "Auto" };
    let joinTimestamp = null;

    let ttsEnabled = false;
    const audioQueue = [];

    // Deepgram
    let isRec = false;
    let mediaRec = null;
    let dgSocket = null;
    let aCtx = null;
    let tStart = 0;
    let tInt = null;

    // Draft bubble (single running transcript)
    let sttDraftRef = null;
    let sttFullText = "";

    // Presence
    let userPresenceRef = null;

    // Emotion
    const EMOTIONS = { neutral:"😐", angry:"😠", excited:"🤩", content:"😊", sad:"😢", scared:"😨", happy:"😀", apologetic:"🙇", curious:"🤔", amazed:"😲" };
    let selectedEmotion = "neutral";

    // =========================================================
    // Sentence shipping + parallel translation
    // =========================================================
    // We ship final STT segments per sentence and translate them in parallel, while maintaining order.
    // Each outgoing message is *already in sender language*; receivers translate per message.
    // For local "listen-to-translation", we translate per sentence for TTS quickly.
    const TRANSLATE_CONCURRENCY = 4;

    function createLimiter(max) {
      let active = 0;
      const q = [];
      const runNext = () => {
        if (active >= max || q.length === 0) return;
        active++;
        const { fn, resolve, reject } = q.shift();
        fn().then(resolve).catch(reject).finally(() => {
          active--;
          runNext();
        });
      };
      return (fn) => new Promise((resolve, reject) => {
        q.push({ fn, resolve, reject });
        runNext();
      });
    }
    const limitTranslate = createLimiter(TRANSLATE_CONCURRENCY);

    // Per-message in-memory cache (avoid re-translate spam)
    const translateCache = new Map(); // key: from|to|text -> translated

    async function translate(text, from, to) {
      if (!text) return "";
      if (from === to) return text;

      const key = `${from}|${to}|${text}`;
      if (translateCache.has(key)) return translateCache.get(key);

      const translated = await limitTranslate(async () => {
        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${from}&tl=${to}&dt=t&q=${encodeURIComponent(text)}`);
        const d = await res.json();
        return d?.[0]?.[0]?.[0] ?? text;
      });

      translateCache.set(key, translated);
      return translated;
    }

    // =========================================================
    // NUANCE SSML for TTS (per sentence)
    // =========================================================
    function escapeForSSML(s) {
      return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
    }
    function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
    function emotionToSpeed(em) {
      const map = { excited:1.12, happy:1.06, curious:1.03, neutral:1.0, content:0.98, apologetic:0.95, sad:0.92, scared:0.96, angry:1.02, amazed:1.05 };
      return clamp(map[em] ?? 1.0, 0.6, 1.5);
    }
    function emotionToVolume(em) {
      const map = { excited:1.08, happy:1.03, neutral:1.0, content:0.98, apologetic:0.95, sad:0.92, scared:0.96, angry:1.05, amazed:1.02, curious:1.0 };
      return clamp(map[em] ?? 1.0, 0.5, 2.0);
    }
    function injectBreaks(text) {
      let t = text;
      t = t.replace(/\.\.\./g, `<break time="420ms"/>`);
      t = t.replace(/([,;:])\s+/g, `$1<break time="160ms"/>`);
      t = t.replace(/([.?!])\s+/g, `$1<break time="260ms"/>`);
      t = t.replace(/\n+/g, `<break time="420ms"/>`);
      return t;
    }
    function injectSpellForCodes(text) {
      return text.replace(/\b([A-Z]{2,}[-_]?[\d]{3,}|[\d]{6,})\b/g, (m) => `<spell>${m}</spell>`);
    }
    function buildNuancedSSML(sentence, emotion="neutral") {
      const safe = escapeForSSML(sentence);
      const withSpell = injectSpellForCodes(safe);
      const withBreaks = injectBreaks(withSpell);
      const spd = emotionToSpeed(emotion).toFixed(2);
      const vol = emotionToVolume(emotion).toFixed(2);
      return `<emotion value="${emotion}" /><speed ratio="${spd}"/><volume ratio="${vol}"/>${withBreaks}`;
    }

    // =========================================================
    // Voices (paired) – minimal: nl forced + fallback
    // =========================================================
    function getVoiceId(targetLang, speakerGender, receiverForcedVoiceId=null) {
      if (targetLang === "nl") return FLEMISH_NL_VOICE_ID;
      if (receiverForcedVoiceId) return receiverForcedVoiceId;
      // Keep fallback – you can plug your big VOICE_MAP here if you want
      return (speakerGender === "Female")
        ? "e07c00bc-4134-4eae-9ea4-1a55fb45746b"
        : "5ee9feff-1265-424a-9d7f-8e4d431a12c7";
    }

    // =========================================================
    // Audio queue (TTS) – consumes sentences already translated
    // =========================================================
    async function processAudioQueue() {
      if (isAudioPlaying || audioQueue.length === 0) return;
      isAudioPlaying = true;

      const item = audioQueue.shift();
      try {
        const voiceId = getVoiceId(item.lang, item.gender, item.voiceId || null);
        const ssml = buildNuancedSSML(item.text, item.emotion || "neutral");

        const res = await fetch("https://api.cartesia.ai/tts/bytes", {
          method: "POST",
          headers: { "Cartesia-Version": CARTESIA_VERSION, "X-API-Key": CARTESIA_KEY, "Content-Type": "application/json" },
          body: JSON.stringify({
            model_id: "sonic-3-latest",
            transcript: ssml,
            voice: { mode: "id", id: voiceId },
            language: item.lang,
            output_format: { container: "wav", encoding: "pcm_f32le", sample_rate: 44100 },
            generation_config: { speed: 1, volume: 1, emotion: item.emotion || "neutral" }
          })
        });

        if (!res.ok) throw new Error(`TTS failed ${res.status}`);
        const audio = new Audio(URL.createObjectURL(await res.blob()));
        audio.onended = () => { isAudioPlaying = false; processAudioQueue(); };
        audio.onerror = () => { isAudioPlaying = false; processAudioQueue(); };
        await audio.play();
      } catch (e) {
        console.error("TTS error:", e);
        isAudioPlaying = false;
        processAudioQueue();
      }
    }

    // =========================================================
    // Firebase: push sentence messages (final STT segments)
    // =========================================================
    function cleanTranscript(t) {
      return String(t).replace(/\b(uhm|um|ah|huh|er|eh|hm|uh)\b/gi, "").replace(/\s\s+/g, " ").trim();
    }

    function pushSentenceMessage(sentenceText) {
      const text = cleanTranscript(sentenceText);
      if (!text) return;

      const msgRef = push(ref(db, `chats/${userData.room}/messages`));
      set(msgRef, {
        text,
        senderId: myUserId,
        senderName: userData.name,
        gender: userData.gender,
        lang: userData.language,
        voiceId: userData.voiceId,
        voiceName: userData.voiceName,
        emotion: selectedEmotion,
        emoji: EMOTIONS[selectedEmotion] || "😐",
        timestamp: Date.now(),
        // sentence marker (helps receiver logic)
        is_sentence: true
      });
    }

    function setDraftMessage(text) {
      const cleaned = cleanTranscript(text);
      if (!cleaned) return;
      if (!sttDraftRef) sttDraftRef = push(ref(db, `chats/${userData.room}/drafts`));
      set(sttDraftRef, {
        text: cleaned,
        senderId: myUserId,
        senderName: userData.name,
        gender: userData.gender,
        lang: userData.language,
        voiceId: userData.voiceId,
        voiceName: userData.voiceName,
        emotion: selectedEmotion,
        emoji: EMOTIONS[selectedEmotion] || "😐",
        timestamp: Date.now()
      });
    }

    function clearDraftMessage() {
      if (!sttDraftRef) return;
      remove(sttDraftRef);
      sttDraftRef = null;
    }

    // =========================================================
    // Receiver: translate per sentence in parallel (ordered apply)
    // =========================================================
    const pendingBySender = new Map(); // senderId -> { seq, buffer[] }
    // We preserve arrival order by timestamp+push order (firebase onChildAdded already ordered by key),
    // but translation completes out of order; we re-order when rendering/queueing audio.

    async function handleIncomingMessage(msg) {
      // If message is from others and needs translation => per sentence translate in parallel
      if (msg.senderId !== myUserId && msg.timestamp >= joinTimestamp) {
        const from = msg.lang || "en";
        const to = userData.language || "en";

        // if already same language, no translation required
        if (from === to) {
          msg.translated = msg.text;
          // queue audio sentence
          audioQueue.push({
            text: msg.translated,
            gender: msg.gender,
            emotion: msg.emotion || "neutral",
            lang: to,
            voiceId: userData.voiceId || null
          });
          if (ttsEnabled) processAudioQueue();
          renderBubble(msg, false);
          return;
        }

        // Parallel translate (limited)
        const translated = await translate(msg.text, from, to);
        msg.translated = translated;

        // queue audio sentence immediately (sentences stay in order due to Firebase ordering;
        // but to avoid out-of-order from translate completion, we enforce per-sender ordering)
        const sid = msg.senderId;
        if (!pendingBySender.has(sid)) pendingBySender.set(sid, { next: 0, buf: new Map() });

        const state = pendingBySender.get(sid);

        // Create a monotonic index per sender using a stable key (timestamp+firebase key is best, but we don't have key here).
        // We'll approximate by pushing buffer in arrival order:
        const idx = state.next + state.buf.size;
        state.buf.set(idx, { msg });

        // Flush in order (0..n) whenever available
        while (state.buf.has(state.next)) {
          const item = state.buf.get(state.next);
          state.buf.delete(state.next);
          state.next++;

          // render + audio in strict per-sender order
          renderBubble(item.msg, false);

          audioQueue.push({
            text: item.msg.translated,
            gender: item.msg.gender,
            emotion: item.msg.emotion || "neutral",
            lang: to,
            voiceId: userData.voiceId || null
          });
          if (ttsEnabled) processAudioQueue();
        }

        return;
      }

      // My own messages or old messages: just render
      msg.translated = msg.text;
      renderBubble(msg, false);
    }

    // =========================================================
    // Bind Firebase
    // =========================================================
    function renderBubble(msg, isLive = false) {
      const isMe = msg.senderId === myUserId;
      const div = document.createElement("div");
      div.className = `flex ${isMe ? "justify-end" : "justify-start"} ${isLive ? "is-live opacity-50" : "message-animate"}`;

      const display = (!isMe && msg.translated) ? msg.translated : msg.text;
      const voiceInfo = msg.voiceName && msg.voiceName !== "Auto" ? ` • ${msg.voiceName}` : "";

      div.innerHTML = `
        <div class="${isMe ? "bg-[#d9fdd3] rounded-tr-none" : "bg-white rounded-tl-none"} p-3 rounded-lg bubble-shadow max-w-[85%] flex items-end gap-2">
          <div class="flex-1">
            <p class="text-[14.5px] text-[#111b21] leading-tight pr-1 pb-1">${display}</p>
            <div class="flex items-center gap-1">
              <span class="text-[8px] text-gray-400 font-bold uppercase tracking-tighter">
                ${msg.senderName} • ${msg.gender} • ${msg.lang}${voiceInfo}
              </span>
            </div>
          </div>
          <div class="emotion-emoji shrink-0" title="${msg.emotion || "neutral"}">${msg.emoji || "😐"}</div>
        </div>
      `;
      ui.msgWin.appendChild(div);
      ui.msgWin.scrollTop = ui.msgWin.scrollHeight;
    }

    function bindFirebase(room) {
      ui.msgWin.innerHTML = "";

      onChildAdded(ref(db, `chats/${room}/messages`), async (snap) => {
        const msg = snap.val();
        if (!msg) return;
        await handleIncomingMessage(msg);
      });

      onValue(ref(db, `chats/${room}/drafts`), (snap) => {
        document.querySelectorAll(".is-live").forEach(el => el.remove());
        const drafts = snap.val();
        if (!drafts) return;
        Object.values(drafts).forEach(val => {
          if (val && val.senderId !== myUserId) renderBubble(val, true);
        });
      });
    }

    // =========================================================
    // Deepgram: ship PER SENTENCE (final segments) while keeping full draft
    // =========================================================
    async function startVoice() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
        });

        isRec = true;
        ui.voiceOver.classList.remove("hidden");
        setupViz(stream);

        sttFullText = "";
        clearDraftMessage();
        setDraftMessage("…");

        tStart = Date.now();
        tInt = setInterval(() => {
          const s = Math.floor((Date.now() - tStart) / 1000);
          ui.timer.innerText = `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
        }, 1000);

        const dgClient = createClient(DEEPGRAM_KEY);
        dgSocket = dgClient.listen.live({
          model: "nova-3",
          language: userData.language,
          smart_format: true,
          punctuate: true,
          interim_results: true,
          vad_events: true,
          endpointing: 900,
          utterance_end_ms: 1200
        });

        dgSocket.on(LiveTranscriptionEvents.Open, () => {
          mediaRec = new MediaRecorder(stream, { mimeType: "audio/webm" });
          mediaRec.ondataavailable = (e) => {
            if (e.data.size > 0 && dgSocket.getReadyState() === 1) dgSocket.send(e.data);
          };
          mediaRec.start(250);
        });

        dgSocket.on(LiveTranscriptionEvents.Transcript, (d) => {
          const alt = d?.channel?.alternatives?.[0];
          const seg = (alt?.transcript || "").trim();
          if (!seg) return;

          if (d.is_final) {
            // 1) Ship per sentence message (robust)
            pushSentenceMessage(seg);

            // 2) Append to running draft transcript
            sttFullText = (sttFullText ? (sttFullText + " " + seg) : seg).trim();
            setDraftMessage(sttFullText);
          } else {
            // interim draft: full + interim
            const merged = (sttFullText ? (sttFullText + " " + seg) : seg).trim();
            setDraftMessage(merged);
          }
        });

        dgSocket.on(LiveTranscriptionEvents.Error, (err) => {
          console.error("Deepgram error:", err);
          stopVoice(false);
        });

      } catch (e) {
        console.error("Mic/STT error:", e);
        stopVoice(false);
      }
    }

    function stopVoice(save) {
      if (!isRec) return;
      isRec = false;
      try { mediaRec?.stop(); } catch {}
      try { dgSocket?.finish(); } catch {}
      clearInterval(tInt);

      ui.voiceOver.classList.add("hidden");
      ui.timer.innerText = "00:00";

      // Clear live draft when stopping
      clearDraftMessage();
      sttFullText = "";
    }

    function setupViz(stream) {
      if (!aCtx) aCtx = new AudioContext();
      const aAn = aCtx.createAnalyser();
      aAn.fftSize = 64;
      aAn.smoothingTimeConstant = 0.82;
      const src = aCtx.createMediaStreamSource(stream);
      src.connect(aAn);

      const b = new Uint8Array(aAn.frequencyBinCount);
      const ctx = ui.viz.getContext("2d");
      ui.viz.width = ui.viz.parentElement.offsetWidth;

      const draw = () => {
        if (!isRec) { try { src.disconnect(); } catch {} return; }
        requestAnimationFrame(draw);
        aAn.getByteFrequencyData(b);
        ctx.clearRect(0, 0, ui.viz.width, ui.viz.height);

        const barWidth = (ui.viz.width / b.length) * 2;
        let x = 0;
        for (let i = 0; i < b.length; i++) {
          const barHeight = (b[i] / 255) * 30;
          const grad = ctx.createLinearGradient(0, 0, 0, 30);
          grad.addColorStop(0, "#00a884");
          grad.addColorStop(1, "#008069");
          ctx.fillStyle = grad;
          ctx.fillRect(x, (30 - barHeight) / 2, barWidth - 1, barHeight);
          x += barWidth;
        }
      };
      draw();
    }

    // =========================================================
    // Connect
    // =========================================================
    function connect(isAuto) {
      if (!isAuto) {
        const n = document.getElementById("user-display-name").value.trim();
        const r = document.getElementById("room-code").value.trim().toUpperCase();
        if (!n) return alert("Enter Name");

        userData.name = n.substring(0, 8);
        userData.room = r || "SUCCESS";
        userData.gender = document.getElementById("user-gender").value;
        userData.language = ui.langSelect.value;

        const v = ui.voiceSelect.value;
        if (v && v !== "browse") {
          userData.voiceId = (userData.language === "nl") ? FLEMISH_NL_VOICE_ID : v;
          userData.voiceName = "Custom";
        } else {
          userData.voiceId = null;
          userData.voiceName = "Auto";
        }

        joinTimestamp = Date.now();
        localStorage.setItem("succes_session", JSON.stringify({ ...userData, joinTime: joinTimestamp }));
      }

      ui.modal.classList.add("hidden");
      ui.app.classList.remove("opacity-0");
      document.getElementById("room-header-name").innerText = userData.room;
      document.getElementById("sidebar-room-name").innerText = userData.room;
      document.getElementById("sidebar-user-name").innerText = userData.name;
      document.getElementById("connection-status").textContent = "Connected";
      document.getElementById("selected-voice-name").textContent = userData.voiceName;

      document.getElementById("user-display-meta").innerText =
        `${userData.name} • ${userData.gender} • ${userData.language.toUpperCase()}`;

      document.body.classList.add("mobile-chat-open");
      bindFirebase(userData.room);
    }

    // =========================================================
    // UI Events (minimal)
    // =========================================================
    ui.ttsBtn.onclick = () => {
      ttsEnabled = !ttsEnabled;
      ui.ttsIcon.className = ttsEnabled ? "fa-solid fa-volume-high text-[#008069]" : "fa-solid fa-volume-xmark text-gray-400";
      ui.ttsSidebarStatus.className = ttsEnabled ? "w-3 h-3 rounded-full bg-green-500" : "w-3 h-3 rounded-full bg-red-500";
      if (ttsEnabled) processAudioQueue();
    };

    ui.txtIn.oninput = () => {
      const v = ui.txtIn.value.trim();
      ui.sendBtn.classList.toggle("hidden", v === "");
      ui.micBtn.classList.toggle("hidden", v !== "");
    };

    ui.sendBtn.onclick = () => {
      const v = ui.txtIn.value.trim();
      if (!v) return;
      // Text messages are already "per message" - leave as is
      const msgRef = push(ref(db, `chats/${userData.room}/messages`));
      set(msgRef, {
        text: v,
        senderId: myUserId,
        senderName: userData.name,
        gender: userData.gender,
        lang: userData.language,
        voiceId: userData.voiceId,
        voiceName: userData.voiceName,
        emotion: selectedEmotion,
        emoji: EMOTIONS[selectedEmotion] || "😐",
        timestamp: Date.now(),
        is_sentence: false
      });
      ui.txtIn.value = "";
      ui.txtIn.oninput();
    };

    ui.micBtn.onclick = startVoice;
    document.getElementById("stop-voice").onclick = () => stopVoice(true);
    document.getElementById("cancel-voice").onclick = () => stopVoice(false);

    // =========================================================
    // Restore session
    // =========================================================
    const saved = localStorage.getItem("succes_session");
    if (saved) {
      const d = JSON.parse(saved);
      userData = { ...userData, ...d };
      joinTimestamp = d.joinTime || Date.now();
      connect(true);
    }
  </script>
</body>
</html>
